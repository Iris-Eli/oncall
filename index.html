    <script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg: #0a0e14; --panel: #12161f; --panel2: #1a1f2b; --hover: #252b3a;
            --ink: #e6e8eb; --muted: #9ca3af; --faint: #6b7280; --line: #2d3548;
            --brand: #8b5cf6; --brand2: #a78bfa; --brand-ink: #ffffff; --glow: rgba(139,92,246,.25);
            --ok: #00ff88; --okbg: rgba(0,255,136,.12); --warn: #ffaa00; --warnbg: rgba(255,170,0,.14);
            --bad: #ff4466; --badbg: rgba(255,68,102,.14); --info: #a78bfa; --infobg: rgba(139,92,246,.16);
            --shadow: 0 2px 10px rgba(0,0,0,.45);
        }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--ink); font-size: 14px; }
        a { color: var(--brand2); text-decoration: none; }
        a:hover { text-decoration: underline; }
        button { font-family: inherit; font-size: 13px; cursor: pointer; }
        .btn { border: 1px solid var(--line); background: var(--panel2); color: var(--ink); padding: 7px 13px; border-radius: 7px; transition: all .15s ease; }
        .btn:hover { border-color: var(--brand); color: #fff; }
        .btn.primary { background: linear-gradient(135deg, var(--brand), var(--brand2)); color: var(--brand-ink); border-color: transparent; box-shadow: 0 0 0 rgba(139,92,246,0); }
        .btn.primary:hover { box-shadow: 0 0 14px var(--glow); }
        .btn.danger { color: var(--bad); border-color: rgba(255,68,102,.4); background: rgba(255,68,102,.08); }
        .btn.sm { padding: 4px 9px; font-size: 12px; border-radius: 6px; }
        input, select, textarea { font-family: inherit; font-size: 13px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel2); color: var(--ink); width: 100%; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--glow); }
        textarea { min-height: 62px; resize: vertical; }
        label { display: block; font-size: 12px; color: var(--muted); margin: 0 0 4px; font-weight: 600; }
        /* Layout */
        #loading, #signin { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; }
        #signin img.logo-hero { width: 190px; max-width: 60vw; margin-bottom: 6px; }
        #app { display: none; grid-template-columns: 236px 1fr; min-height: 100vh; }
        #sidebar { background: var(--panel); color: var(--muted); padding: 22px 12px; position: sticky; top: 0; height: 100vh; border-right: 1px solid var(--line); }
        #sidebar .brand { padding: 2px 10px 18px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
        #sidebar .brand img.logo-img { width: 100%; max-width: 158px; display: block; }
        #sidebar .brand .brand-sub { display: block; font-weight: 700; font-size: 12px; margin-top: 10px; letter-spacing: .3px; background: linear-gradient(135deg, var(--brand), var(--brand2)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; }
        #sidebar nav a { display: flex; align-items: center; gap: 10px; color: var(--muted); padding: 9px 11px; border-radius: 8px; margin-bottom: 2px; font-weight: 600; transition: all .15s ease; }
        #sidebar nav a:hover { background: var(--hover); color: #fff; text-decoration: none; }
        #sidebar nav a.active { background: linear-gradient(135deg, var(--brand), var(--brand2)); color: #fff; box-shadow: 0 0 14px var(--glow); }
        #sidebar .who { position: absolute; bottom: 16px; left: 12px; right: 12px; font-size: 11px; color: var(--faint); border-top: 1px solid var(--line); padding-top: 10px; }
        #sidebar .who a { color: var(--brand2); }
        main { padding: 22px 26px 60px; overflow: auto; }
        .page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
        .page-head h1 { font-size: 20px; margin: 0; }
        .page-head .actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
        .toolbar .search { flex: 1; min-width: 200px; max-width: 340px; }
        /* Cards / tiles */
        .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow); }
        .tile .k { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .4px; }
        .tile .v { font-size: 26px; font-weight: 800; margin-top: 4px; color: #fff; }
        .tile .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
        .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); margin-bottom: 18px; overflow: hidden; }
        .panel h2 { font-size: 14px; margin: 0; padding: 13px 16px; border-bottom: 1px solid var(--line); background: var(--panel2); }
        .panel .body { padding: 14px 16px; }
        /* Tables */
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
        th { font-size: 11px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); background: var(--panel2); position: sticky; top: 0; }
        tbody tr:hover { background: var(--panel2); }
        .table-wrap { overflow-x: auto; }
        .filter-row th { padding: 5px 8px; background: var(--panel); }
        .filter-row input { padding: 4px 7px; font-size: 12px; }
        tr.hl td { background: rgba(139,92,246,.10); }
        tr.ov td { background: rgba(255,170,0,.10); }
        /* Badges */
        .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; white-space: nowrap; }
        .b-ok { background: var(--okbg); color: var(--ok); }
        .b-warn { background: var(--warnbg); color: var(--warn); }
        .b-bad { background: var(--badbg); color: var(--bad); }
        .b-info { background: var(--infobg); color: var(--info); }
        .b-mut { background: var(--hover); color: var(--muted); }
        .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
        /* Status banners */
        .status { padding: 10px 14px; border-radius: 9px; font-size: 13px; margin-bottom: 14px; border: 1px solid var(--line); }
        .status.ok { background: var(--okbg); color: var(--ok); border-color: rgba(0,255,136,.35); }
        .status.warn { background: var(--warnbg); color: var(--warn); border-color: rgba(255,170,0,.4); }
        .status.bad { background: var(--badbg); color: var(--bad); border-color: rgba(255,68,102,.4); }
        /* Modal */
        .modal-bg { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.62); z-index: 50; align-items: flex-start; justify-content: center; padding: 40px 16px; overflow: auto; backdrop-filter: blur(2px); }
        .modal-bg.open { display: flex; }
        .modal { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; width: 100%; max-width: 620px; box-shadow: 0 24px 60px rgba(0,0,0,.6); }
        .modal.wide { max-width: 940px; }
        .modal .m-head { display: flex; align-items: center; justify-content: space-between; padding: 15px 18px; border-bottom: 1px solid var(--line); }
        .modal .m-head h3 { margin: 0; font-size: 16px; }
        .modal .m-head .x { border: none; background: none; font-size: 22px; color: var(--muted); line-height: 1; }
        .modal .m-body { padding: 18px; }
        .modal .m-foot { padding: 14px 18px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; }
        .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
        .field { margin-bottom: 12px; }
        .fs { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
        .fs > legend { font-size: 12px; font-weight: 700; color: var(--brand2); padding: 0 6px; text-transform: uppercase; letter-spacing: .4px; }
        /* People picker */
        .people-results { border: 1px solid var(--line); border-radius: 8px; margin-top: 4px; max-height: 210px; overflow: auto; background: var(--panel2); }
        .people-results .p { padding: 8px 10px; cursor: pointer; border-bottom: 1px solid var(--line); }
        .people-results .p:hover { background: var(--hover); }
        .people-results .p small { color: var(--muted); display: block; }
        /* Now / who-is-on-call hero */
        .now-hero { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; background: linear-gradient(135deg, rgba(139,92,246,.16), rgba(167,139,250,.06)); border: 1px solid var(--line); border-radius: 14px; padding: 18px 22px; margin-bottom: 18px; }
        .now-hero .avatar { width: 62px; height: 62px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 800; color: #fff; }
        .now-hero .who-name { font-size: 26px; font-weight: 800; color: #fff; }
        .now-hero .who-sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
        /* Week strip */
        .weekstrip { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
        .ws-card { background: var(--panel); border: 1px solid var(--line); border-radius: 11px; padding: 11px 13px; position: relative; }
        .ws-card.today { border-color: var(--brand); box-shadow: 0 0 12px var(--glow); }
        .ws-card .slot { font-size: 11px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); font-weight: 700; }
        .ws-card .nm { font-weight: 800; margin-top: 5px; font-size: 15px; }
        .ws-card .dt { font-size: 11px; color: var(--faint); margin-top: 3px; }
        /* Calendar */
        .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
        .cal .dow { font-size: 11px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); font-weight: 700; text-align: center; padding: 4px 0; }
        .cal .day { min-height: 72px; background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 6px 7px; font-size: 12px; }
        .cal .day.out { opacity: .35; }
        .cal .day.today { border-color: var(--brand); box-shadow: 0 0 10px var(--glow); }
        .cal .day .dnum { color: var(--faint); font-weight: 700; font-size: 11px; }
        .cal .day .who { margin-top: 5px; font-weight: 700; }
        .cal .day .hol { color: var(--warn); font-size: 10.5px; margin-top: 3px; }
        /* Bars */
        .bar-track { background: var(--panel2); border-radius: 6px; height: 20px; overflow: hidden; }
        .bar-fill { height: 100%; background: linear-gradient(90deg, var(--brand), var(--brand2)); }
        /* Toast */
        #toast { position: fixed; bottom: 22px; right: 22px; z-index: 90; display: flex; flex-direction: column; gap: 8px; }
        #toast .t { background: var(--panel2); border: 1px solid var(--line); color: #fff; padding: 11px 16px; border-radius: 9px; box-shadow: var(--shadow); font-size: 13px; max-width: 360px; }
        #toast .t.ok { border-color: var(--ok); } #toast .t.bad { border-color: var(--bad); } #toast .t.warn { border-color: var(--warn); }
        .muted { color: var(--muted); } .right { text-align: right; } .nowrap { white-space: nowrap; }
        .empty { text-align: center; color: var(--muted); padding: 30px; }
        .drag-handle { cursor: grab; color: var(--faint); }
        @media (max-width: 760px) {
            #app { grid-template-columns: 1fr; }
            /* Sidebar becomes a compact sticky top bar with a horizontally-scrollable nav */
            #sidebar { position: sticky; top: 0; z-index: 30; height: auto; padding: 8px 10px; border-right: none; border-bottom: 1px solid var(--line); }
            #sidebar .brand { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 8px; margin-bottom: 8px; }
            #sidebar .brand img.logo-img { max-width: 116px; }
            #sidebar .brand .brand-sub { display: none; }
            #sidebar nav { display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
            #sidebar nav::-webkit-scrollbar { display: none; }
            #sidebar nav a { flex: 0 0 auto; margin-bottom: 0; padding: 9px 13px; white-space: nowrap; }
            #sidebar .who { position: static; margin-top: 8px; padding-top: 8px; text-align: right; }
            main { padding: 14px 13px 48px; }
            .grid2, .grid3 { grid-template-columns: 1fr; }
            .cal { gap: 4px; }
            .cal .day { min-height: 52px; padding: 4px 5px; }
            .cal .day .who { font-size: 11px; }
            .modal-bg { padding: 10px; }
            .modal .m-body { padding: 14px; }
            .now-hero { padding: 14px 16px; gap: 12px; }
            .now-hero .avatar { width: 50px; height: 50px; font-size: 20px; }
            .now-hero .who-name { font-size: 21px; }
            .page-head h1 { font-size: 18px; }
            th, td { padding: 8px 9px; }
            /* 16px inputs stop iOS Safari from auto-zooming on focus */
            input, select, textarea { font-size: 16px; }
        }
    </style>
</head>

    <script>
    /* ============================================================================
       On-Call Rotation — single-file app, SharePoint (Graph) backed.
       Same architecture as ITInventory / NetInventory: MSAL auth, SharePointDataStore
       over Graph, localStorage is a 5-min cache ONLY. The SCHEDULE itself is computed
       deterministically in the browser (see computeSchedule); the only state of record
       in SharePoint is Config (roster/anchor/holidays), History (holiday fairness across
       years), and Overrides (manual one-off swaps). Algorithm ported 1:1 from
       OnCallGenerator_SelfSustaining.osts.
       ============================================================================ */

    const CONFIG = {
        clientId: 'f0bc695d-e675-4aa8-a114-8b7935183c30',   // shared Iris SPA app reg (add this Pages URL as a redirect URI)
        tenantId: 'iristransport.onmicrosoft.com',
        hostname: 'iristransport.sharepoint.com',
        sitePath: 'sites/EngineeringPriorities',             // resolved to a composite site id at runtime
        pagesUrl: 'https://iris-eli.github.io/oncall/',      // public deploy URL (redirect base)
        siteId: null,                                        // filled by resolveSiteId()
        listNames: {
            engineers: 'OnCall_Engineers',
            config: 'OnCall_Config',
            holidays: 'OnCall_Holidays',
            history: 'OnCall_History',
            overrides: 'OnCall_Overrides',
            schedule: 'OnCall_Schedule'      // derived per-day cache the Teams flow reads (see publishSchedule)
        },
        fieldMappings: {
            engineers: { name: 'Title', sortOrder: 'SortOrder', active: 'Active' },
            config: { key: 'Title', value: 'Value' },
            holidays: { name: 'Title', observe: 'Observe', sortOrder: 'SortOrder' },
            history: { key: 'Title', year: 'Year', holiday: 'Holiday', engineer: 'Engineer' },
            overrides: {
                key: 'Title', shiftStart: 'ShiftStart', shiftEnd: 'ShiftEnd', slot: 'Slot',
                originalEngineer: 'OriginalEngineer', newEngineer: 'NewEngineer', reason: 'Reason',
                createdBy: 'CreatedBy', createdDate: 'CreatedDate'
            },
            schedule: { key: 'Title', date: 'ScheduleDate', engineer: 'Engineer', slot: 'Slot', hours: 'Hours', holiday: 'Holiday', isOverride: 'IsOverride' }
        },
        // Numeric/date columns: '' must become null on write (Graph rejects '' for these types).
        nonTextCols: new Set(['SortOrder', 'Year', 'ShiftStart', 'ShiftEnd', 'CreatedDate', 'ScheduleDate', 'Hours']),
        cacheTimeout: 5 * 60 * 1000
    };

    // ---- Defaults used when SharePoint config lists are empty (first run / not seeded) ----
    const DEFAULT_ROSTER = ['Connor', 'Sedrick', 'Josh', 'Ian', 'Kris'];   // normal rotation order
    const DEFAULT_ANCHOR = '2026-08-10';   // the Monday the rotation starts — schedule begins here, nothing before it
    const DEFAULT_HORIZON = 15;            // months ahead of today to keep populated

    // Every holiday name the built-in date calculator understands (no dates are ever hardcoded).
    const RECOGNIZED_HOLIDAYS = ["New Year's Day", 'MLK Day', 'Presidents Day', 'Good Friday',
        'Memorial Day', 'Juneteenth', 'Independence Day', 'Labor Day', 'Columbus Day', 'Veterans Day',
        'Thanksgiving', 'Day after Thanksgiving', 'Christmas Eve', 'Christmas Day', "New Year's Eve"];
    // Sensible starting selection (HANDOFF: final list still to be confirmed with HR — fully editable in Config).
    const DEFAULT_OBSERVED = ["New Year's Day", 'Memorial Day', 'Juneteenth', 'Independence Day',
        'Labor Day', 'Thanksgiving', 'Day after Thanksgiving', 'Christmas Eve', 'Christmas Day', "New Year's Eve"];

    const PALETTE = ['#8b5cf6', '#00ff88', '#ffaa00', '#4ac2c2', '#ff6f9c', '#4a8fe0', '#c2c24a', '#e0714a'];

    /* ------------------------------------------------------------------ MSAL */
    const msalConfig = {
        auth: { clientId: CONFIG.clientId, authority: `https://login.microsoftonline.com/${CONFIG.tenantId}`, redirectUri: CONFIG.pagesUrl },
        cache: { cacheLocation: 'localStorage', storeAuthStateInCookie: true } // cookie fallback helps mobile Safari / ITP
    };
    const msalInstance = new msal.PublicClientApplication(msalConfig);
    const loginRequest = { scopes: ['Sites.ReadWrite.All', 'User.Read', 'User.ReadBasic.All'] };
    let accessToken = null, currentUser = null;

    (async function initApp() {
        try {
            const resp = await msalInstance.handleRedirectPromise();
            if (resp) { currentUser = resp.account; accessToken = resp.accessToken; msalInstance.setActiveAccount(currentUser); return start(); }
            const accts = msalInstance.getAllAccounts();
            if (accts.length) {
                currentUser = accts[0]; msalInstance.setActiveAccount(currentUser);
                try { const t = await msalInstance.acquireTokenSilent({ ...loginRequest, account: currentUser }); accessToken = t.accessToken; return start(); }
                catch (e) { return showSignIn(); }
            }
            showSignIn();
        } catch (e) { console.error('init', e); showSignIn(e); }
    })();

    function showSignIn(err) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('signin').style.display = 'flex';
        document.getElementById('signinBtn').style.display = 'block';
        const box = document.getElementById('signinErr');
        if (err && box) { box.style.display = 'block'; box.textContent = 'Sign-in error: ' + (err.errorCode ? err.errorCode + ' — ' : '') + (err.errorMessage || err.message || String(err)); }
        else if (box) { box.style.display = 'none'; }
    }
    function doSignIn() { msalInstance.loginRedirect(loginRequest); }

    async function getToken() {
        try { const t = await msalInstance.acquireTokenSilent({ ...loginRequest, account: currentUser }); accessToken = t.accessToken; return accessToken; }
        catch (e) { msalInstance.acquireTokenRedirect(loginRequest); throw e; }
    }

    async function graphFetch(endpoint, options = {}, retry = true) {
        const url = endpoint.startsWith('http') ? endpoint : `https://graph.microsoft.com/v1.0${endpoint}`;
        const headers = Object.assign({ 'Authorization': `Bearer ${accessToken}` }, options.headers || {});
        if (options.body && !headers['Content-Type']) headers['Content-Type'] = 'application/json';
        const res = await fetch(url, { ...options, headers });
        if (res.status === 401 && retry) { await getToken(); return graphFetch(endpoint, options, false); }
        if (!res.ok) { const txt = await res.text(); throw new Error(`Graph ${res.status}: ${txt.slice(0, 300)}`); }
        if (res.status === 204) return null;
        const ct = res.headers.get('content-type') || '';
        return ct.includes('json') ? res.json() : res.text();
    }

    async function resolveSiteId() {
        if (CONFIG.siteId) return CONFIG.siteId;
        const cached = localStorage.getItem('oncall_siteId');
        if (cached) { CONFIG.siteId = cached; return cached; }
        const site = await graphFetch(`/sites/${CONFIG.hostname}:/${CONFIG.sitePath}`);
        CONFIG.siteId = site.id; localStorage.setItem('oncall_siteId', site.id);
        return site.id;
    }

    /* --------------------------------------------------- SharePoint data store */
    class SharePointDataStore {
        constructor() { this.cache = {}; this.cacheAt = {}; }
        _list(entity) { return CONFIG.listNames[entity]; }
        _sanitize(fields) {
            const out = {};
            for (const [col, v] of Object.entries(fields)) {
                if (v === '' && CONFIG.nonTextCols.has(col)) { out[col] = null; continue; }
                if (v === '' && col !== 'Title') { out[col] = null; continue; }
                out[col] = v;
            }
            return out;
        }
        mapFromSharePoint(entity, item) {
            const map = CONFIG.fieldMappings[entity], f = item.fields || {};
            const o = { _spItemId: item.id, _modified: item.lastModifiedDateTime, _created: item.createdDateTime };
            for (const [app, col] of Object.entries(map)) o[app] = (f[col] !== undefined && f[col] !== null) ? f[col] : '';
            return o;
        }
        mapToSharePoint(entity, obj) {
            const map = CONFIG.fieldMappings[entity], fields = {};
            for (const [app, col] of Object.entries(map)) { if (obj[app] !== undefined) fields[col] = obj[app]; }
            return this._sanitize(fields);
        }
        async getAll(entity, force = false) {
            if (!force && this.cache[entity] && (Date.now() - this.cacheAt[entity] < CONFIG.cacheTimeout)) return this.cache[entity];
            await resolveSiteId();
            let endpoint = `/sites/${CONFIG.siteId}/lists/${this._list(entity)}/items?expand=fields&$top=5000`;
            const rows = [];
            try {
                while (endpoint) {
                    const data = await graphFetch(endpoint);
                    (data.value || []).forEach(it => rows.push(this.mapFromSharePoint(entity, it)));
                    endpoint = data['@odata.nextLink'] ? data['@odata.nextLink'].replace('https://graph.microsoft.com/v1.0', '') : null;
                }
            } catch (e) {
                if (/\b404\b|itemNotFound|does not exist|Not Found/i.test(e.message)) {
                    console.warn(`List "${this._list(entity)}" not found — treating as empty. Run sp-create-oncall.ps1 to add it.`);
                    return [];
                }
                throw e;
            }
            this.cache[entity] = rows; this.cacheAt[entity] = Date.now();
            return rows;
        }
        async add(entity, obj) {
            await resolveSiteId();
            const fields = this.mapToSharePoint(entity, obj);
            const res = await graphFetch(`/sites/${CONFIG.siteId}/lists/${this._list(entity)}/items`, { method: 'POST', body: JSON.stringify({ fields }) });
            this.clear(entity); return res;
        }
        async update(entity, spItemId, obj) {
            await resolveSiteId();
            const fields = this.mapToSharePoint(entity, obj);
            const res = await graphFetch(`/sites/${CONFIG.siteId}/lists/${this._list(entity)}/items/${spItemId}/fields`, { method: 'PATCH', body: JSON.stringify(fields) });
            this.clear(entity); return res;
        }
        async remove(entity, spItemId) {
            await resolveSiteId();
            await graphFetch(`/sites/${CONFIG.siteId}/lists/${this._list(entity)}/items/${spItemId}`, { method: 'DELETE' });
            this.clear(entity);
        }
        clear(entity) { if (entity) { delete this.cache[entity]; } else { this.cache = {}; } }
    }
    const store = new SharePointDataStore();

    /* ------------------------------------------------- Entra/M365 people picker */
    async function searchDirectoryPeople(query) {
        if (!query || query.length < 2) return [];
        const q = encodeURIComponent(query.replace(/'/g, "''"));
        const filter = `startswith(displayName,'${q}') or startswith(mail,'${q}') or startswith(userPrincipalName,'${q}')`;
        const data = await graphFetch(`/users?$filter=${filter}&$top=12&$select=id,displayName,userPrincipalName,mail,jobTitle`);
        return data.value || [];
    }
    // Wire a text input to a directory search dropdown. cb(person) fires on pick.
    function wirePicker(input, results, cb) {
        let timer = null;
        input.addEventListener('input', () => {
            clearTimeout(timer);
            const q = input.value.trim();
            if (q.length < 2) { results.innerHTML = ''; return; }
            timer = setTimeout(async () => {
                try {
                    const people = await searchDirectoryPeople(q);
                    results.innerHTML = people.length ? people.map(p =>
                        `<div class="p" data-name="${esc(p.displayName)}">${esc(p.displayName)}<small>${esc(p.userPrincipalName || p.mail || '')}${p.jobTitle ? ' · ' + esc(p.jobTitle) : ''}</small></div>`).join('')
                        : '<div class="p muted">No matches</div>';
                    results.querySelectorAll('.p[data-name]').forEach(el => el.onclick = () => { cb(el.dataset.name); results.innerHTML = ''; });
                } catch (e) { results.innerHTML = '<div class="p muted">Directory search failed</div>'; }
            }, 260);
        });
    }

    /* ---------------------------------------------------------------- utilities */
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    function fmt(d) { return d.toISOString().slice(0, 10); }
    function fmtNice(d) { return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', timeZone: 'UTC' }); }
    function fmtNiceY(d) { return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' }); }
    function toUTC(s) { if (!s) return null; const [y, m, dd] = String(s).slice(0, 10).split('-').map(Number); return new Date(Date.UTC(y, m - 1, dd)); }
    function addDays(d, n) { const r = new Date(d); r.setUTCDate(r.getUTCDate() + n); return r; }
    function addMonths(d, n) { const r = new Date(d); r.setUTCMonth(r.getUTCMonth() + n); return r; }
    function todayUTC() { const n = new Date(); return new Date(Date.UTC(n.getUTCFullYear(), n.getUTCMonth(), n.getUTCDate())); }
    function nowUTC() { return new Date(); }
    function toast(msg, kind = '') { const t = document.createElement('div'); t.className = 't ' + kind; t.textContent = msg; document.getElementById('toast').appendChild(t); setTimeout(() => t.remove(), 4200); }
    function colorFor(name) { const i = STATE.roster.indexOf(name); return PALETTE[i >= 0 ? i % PALETTE.length : (hashName(name) % PALETTE.length)]; }
    function hashName(s) { let h = 0; for (let i = 0; i < String(s).length; i++) h = (h * 31 + s.charCodeAt(i)) & 0xffff; return h; }
    function personPill(name) { const c = colorFor(name); return `<span class="pill" style="background:${c}22;color:${c}">${esc(name || '—')}</span>`; }
    function initials(name) { return String(name || '?').trim().split(/\s+/).map(w => w[0]).slice(0, 2).join('').toUpperCase(); }

    /* ============================================================================
       ROTATION ALGORITHM — ported from OnCallGenerator_SelfSustaining.osts.
       Deterministic base rotation + per-year holiday fairness with cross-year history.
       ============================================================================ */
    const SLOTS = [
        { label: 'Monday', hours: 24, dayOffset: 0 },
        { label: 'Tuesday', hours: 24, dayOffset: 1 },
        { label: 'Wednesday', hours: 24, dayOffset: 2 },
        { label: 'Thursday', hours: 24, dayOffset: 3 },
        { label: 'Friday', hours: 24, dayOffset: 4 },
        { label: 'Weekend', hours: 48, dayOffset: 5 }
    ];

    function nthWeekday(year, month, weekday, n) {
        let d = new Date(Date.UTC(year, month, 1)), count = 0;
        while (true) { if (d.getUTCDay() === weekday) { count++; if (count === n) return d; } d = addDays(d, 1); }
    }
    function lastWeekday(year, month, weekday) {
        let d = new Date(Date.UTC(year, month + 1, 0));
        while (d.getUTCDay() !== weekday) d = addDays(d, -1);
        return d;
    }
    function easterSunday(year) {
        const a = year % 19, b = Math.floor(year / 100), c = year % 100, d = Math.floor(b / 4), e = b % 4;
        const f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
        const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4;
        const l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
        const month = Math.floor((h + l - 7 * m + 114) / 31), day = ((h + l - 7 * m + 114) % 31) + 1;
        return new Date(Date.UTC(year, month - 1, day));
    }
    function holidayDateForYear(name, year) {
        switch (name) {
            case "New Year's Day": return new Date(Date.UTC(year, 0, 1));
            case 'MLK Day': return nthWeekday(year, 0, 1, 3);
            case 'Presidents Day': return nthWeekday(year, 1, 1, 3);
            case 'Good Friday': return addDays(easterSunday(year), -2);
            case 'Memorial Day': return lastWeekday(year, 4, 1);
            case 'Juneteenth': return new Date(Date.UTC(year, 5, 19));
            case 'July 4th': return new Date(Date.UTC(year, 6, 4));
            case 'Independence Day': return new Date(Date.UTC(year, 6, 4));
            case 'Labor Day': return nthWeekday(year, 8, 1, 1);
            case 'Columbus Day': return nthWeekday(year, 9, 1, 2);
            case 'Veterans Day': return new Date(Date.UTC(year, 10, 11));
            case 'Thanksgiving': return nthWeekday(year, 10, 4, 4);
            case 'Day after Thanksgiving': return addDays(nthWeekday(year, 10, 4, 4), 1);
            case 'Christmas Eve': return new Date(Date.UTC(year, 11, 24));
            case 'Christmas Day': return new Date(Date.UTC(year, 11, 25));
            case "New Year's Eve": return new Date(Date.UTC(year, 11, 31));
            default: return null;
        }
    }

    // Rotation is PHASED to the anchor: anchor Monday === global slot index 0. Display may begin
    // before the anchor (the transition week is pre-anchor); the person for any slot is derived
    // from its offset to the anchor, so a negative (pre-anchor) index is well-defined.
    // Per-week rotation stride. A week has 6 shifts but the team has n; the shift for slot j of
    // week w is engineers[(w*stride + j) % n]. stride = 6 (one shift-index per shift) gives a
    // perfectly continuous hand-off order and is used whenever 6 is coprime to n (e.g. n=5 and n=7,
    // so their behavior is unchanged). When 6 shares a factor with n (n=3,4,6,8,12,20,…) a fixed slot
    // like "Weekend" would otherwise land on the same person forever, so we bump to the smallest
    // larger stride that is coprime to n AND doesn't collide at the week boundary — guaranteeing every
    // slot type rotates through everyone and nobody is stuck with all the weekends.
    const gcd = (a, b) => b ? gcd(b, a % b) : a;
    function rotationStride(n) {
        let s = SLOTS.length;
        while (gcd(s, n) !== 1 || (s - 5) % n === 0) { s++; if (s > SLOTS.length + n + 8) return SLOTS.length; }
        return s;
    }
    function buildSchedule(engineers, anchor, start, end) {
        const rows = []; const n = engineers.length;
        const anchorMon = mondayOf(anchor);
        const stride = rotationStride(n);
        let weekMonday = mondayOf(start);
        while (weekMonday <= end) {
            const weekIndex = Math.round((weekMonday - anchorMon) / (7 * 86400000));
            for (let j = 0; j < SLOTS.length; j++) {
                const slot = SLOTS[j];
                const s = addDays(weekMonday, slot.dayOffset);
                const e = slot.label === 'Weekend' ? addDays(weekMonday, 7) : addDays(s, 1);
                if (s > end) continue;
                const globalIdx = weekIndex * stride + j;
                rows.push({ start: s, end: e, label: slot.label, hours: slot.hours, person: engineers[((globalIdx % n) + n) % n] });
            }
            weekMonday = addDays(weekMonday, 7);
        }
        return rows;
    }
    function ownerAt(rows, date) { return rows.find(r => date >= r.start && date < r.end) || null; }
    function checkAdjacency(rows) {
        const byStart = {}; rows.forEach(r => (byStart[fmt(r.start)] = r));
        return rows.filter(r => byStart[fmt(r.end)] && byStart[fmt(r.end)].person === r.person);
    }
    function permutations(arr) {
        if (arr.length <= 1) return [arr];
        const res = [];
        for (let i = 0; i < arr.length; i++) {
            const rest = arr.slice(0, i).concat(arr.slice(i + 1));
            for (const p of permutations(rest)) res.push([arr[i], ...p]);
        }
        return res;
    }
    // Resolve one calendar year's holiday fairness. Two solvers, same contract:
    //   HARD: no back-to-back stacking (also prevents 2 holidays in a row).
    //   HARD w/ fallback: nobody repeats the SAME holiday they had the prior year.
    //   Tie-break by penalty: 10×(repeats of that person+holiday in history) + (that person's load).
    // Dispatch on team size: exact brute force is O(n!), fine to ~8 engineers; above that we use a
    // greedy, adjacency-safe min-penalty assignment so the tool scales (e.g. to 20). See phase_test.
    const BRUTE_MAX_ENGINEERS = 8;
    function solveYearFairness(rows, holidaysThisYear, engineers, history, year) {
        return engineers.length <= BRUTE_MAX_ENGINEERS
            ? solveYearFairnessBrute(rows, holidaysThisYear, engineers, history, year)
            : solveYearFairnessHeuristic(rows, holidaysThisYear, engineers, history, year);
    }

    // Exact: try every engineers→holidays permutation, keep the lowest-penalty clean one.
    function solveYearFairnessBrute(rows, holidaysThisYear, engineers, history, year) {
        const holOwner = holidaysThisYear.map(h => ({ ...h, owner: ownerAt(rows, h.date) })).filter(h => h.owner);
        if (holOwner.length === 0) return { solution: { rows: rows.map(r => ({ ...r })), swaps: [], counts: {} }, relaxed: false };
        const perms = permutations(engineers);
        const priorTotals = {}; engineers.forEach(e => (priorTotals[e] = history.filter(h => h.person === e).length));

        function search(enforceNoConsecutiveRepeat) {
            let best = null;
            for (const perm of perms) {
                const working = rows.map(r => ({ ...r }));
                const swaps = []; const used = new Set(); let ok = true;
                for (let i = 0; i < holOwner.length; i++) {
                    const h = holOwner[i];
                    const newPerson = perm[i % perm.length];
                    if (h.owner.person === newPerson) continue;
                    const dur = h.owner.hours;
                    const candidates = working.filter(r => r.person === newPerson && r.hours === dur &&
                        !holidaysThisYear.some(hh => hh.date >= r.start && hh.date < r.end) && !used.has(fmt(r.start)));
                    candidates.sort((a, b) => Math.abs(a.start.getTime() - h.owner.start.getTime()) - Math.abs(b.start.getTime() - h.owner.start.getTime()));
                    if (candidates.length === 0) { ok = false; break; }
                    used.add(fmt(candidates[0].start));
                    swaps.push({ holiday: h, oldPerson: h.owner.person, newPerson, partner: candidates[0] });
                }
                if (!ok) continue;
                swaps.forEach(sw => { const hr = ownerAt(working, sw.holiday.date); hr.person = sw.newPerson; sw.partner.person = sw.oldPerson; });
                if (checkAdjacency(working).length > 0) continue;
                const counts = {}; holOwner.forEach(h => { const p = ownerAt(working, h.date).person; counts[p] = (counts[p] || 0) + 1; });
                if (holidaysThisYear.length <= engineers.length && Math.max(...Object.values(counts)) > 1) continue;
                if (enforceNoConsecutiveRepeat) {
                    let violates = false;
                    for (const h of holOwner) {
                        const p = ownerAt(working, h.date).person;
                        if (history.some(hh => hh.year === year - 1 && hh.holiday === h.name && hh.person === p)) { violates = true; break; }
                    }
                    if (violates) continue;
                }
                let penalty = 0;
                holOwner.forEach(h => {
                    const p = ownerAt(working, h.date).person;
                    const repeatCount = history.filter(hh => hh.holiday === h.name && hh.person === p).length;
                    penalty += 10 * repeatCount + priorTotals[p];
                });
                if (!best || penalty < best.penalty) best = { rows: working, swaps, counts, penalty };
            }
            return best;
        }
        let sol = search(true), relaxed = false;
        if (!sol) { sol = search(false); relaxed = true; }
        return { solution: sol, relaxed };
    }

    // Would swapping holRow→c and partner→curOwner leave the schedule free of back-to-back stacking?
    function swapIsClean(working, holRow, partner, c, curOwner) {
        const copy = working.map(r => r === holRow ? { ...r, person: c } : (r === partner ? { ...r, person: curOwner } : r));
        return checkAdjacency(copy).length === 0;
    }

    // Scalable: greedy per-holiday assignment. For each holiday (date order) pick the lowest-penalty
    // engineer among clean, equal-duration swaps (or keep the current owner). Only ever applies swaps
    // that keep the whole schedule clean, so it can't manufacture stacking. O(holidays × engineers ×
    // rows) — no factorial. Same hard rules + penalty as the brute solver; falls back + flags if the
    // no-repeat-last-year rule can't be met.
    function solveYearFairnessHeuristic(rows, holidaysThisYear, engineers, history, year) {
        const holList = holidaysThisYear.map(h => ({ ...h })).sort((a, b) => a.date - b.date);
        if (holList.length === 0) return { solution: { rows: rows.map(r => ({ ...r })), swaps: [], counts: {} }, relaxed: false };
        const priorTotals = {}; engineers.forEach(e => (priorTotals[e] = history.filter(x => x.person === e).length));
        const capEnforced = holidaysThisYear.length <= engineers.length;

        function run(enforceNoRepeat) {
            const working = rows.map(r => ({ ...r }));
            const swaps = [], used = new Set(), yearCount = {}; engineers.forEach(e => (yearCount[e] = 0));
            const repeats = (c, name) => history.filter(x => x.holiday === name && x.person === c).length;
            const lastYear = (c, name) => history.some(x => x.year === year - 1 && x.holiday === name && x.person === c);
            for (const h of holList) {
                const holRow = ownerAt(working, h.date); if (!holRow) continue;
                const dur = holRow.hours, curOwner = holRow.person;
                const pen = c => 10 * repeats(c, h.name) + priorTotals[c] + yearCount[c] * (capEnforced ? 1000 : 10);
                const options = [];
                // keep the current owner (always adjacency-clean since nothing changes)
                if (!(enforceNoRepeat && lastYear(curOwner, h.name)))
                    options.push({ c: curOwner, partner: null, pen: pen(curOwner) });
                // or trade to another engineer via a clean, equal-duration, non-holiday shift.
                // The per-year load cap is a heavy PENALTY (pen: yearCount×1000), not a hard wall —
                // a greedy can't afford a hard cap (it starves the last holidays), and the penalty
                // still yields max-1-per-person in practice while guaranteeing a feasible option.
                for (const c of engineers) {
                    if (c === curOwner) continue;
                    if (enforceNoRepeat && lastYear(c, h.name)) continue;
                    const cands = working.filter(r => r.person === c && r.hours === dur && r !== holRow &&
                        !holidaysThisYear.some(hh => hh.date >= r.start && hh.date < r.end) && !used.has(fmt(r.start)))
                        .sort((a, b) => Math.abs(a.start.getTime() - holRow.start.getTime()) - Math.abs(b.start.getTime() - holRow.start.getTime()));
                    let partner = null;
                    for (const p of cands) { if (swapIsClean(working, holRow, p, c, curOwner)) { partner = p; break; } }
                    if (!partner) continue;
                    options.push({ c, partner, pen: pen(c) });
                }
                if (options.length === 0) return null; // forced to move but no clean landing spot
                options.sort((a, b) => a.pen - b.pen);
                const best = options[0];
                if (best.partner) { used.add(fmt(best.partner.start)); holRow.person = best.c; best.partner.person = curOwner; swaps.push({ holiday: h, oldPerson: curOwner, newPerson: best.c, partner: best.partner }); }
                yearCount[best.c] = (yearCount[best.c] || 0) + 1;
            }
            if (checkAdjacency(working).length > 0) return null;
            const counts = {}; holList.forEach(h => { const p = ownerAt(working, h.date).person; counts[p] = (counts[p] || 0) + 1; });
            return { rows: working, swaps, counts };
        }
        let sol = run(true), relaxed = false;
        if (!sol) { sol = run(false); relaxed = true; }
        return { solution: sol, relaxed };
    }

    /* ============================================================================
       STATE + load + compute
       ============================================================================ */
    const STATE = {
        engineers: [],      // [{name, sortOrder, active, _spItemId}]
        roster: [],         // active names in order (drives color + rotation)
        anchor: DEFAULT_ANCHOR,
        horizon: DEFAULT_HORIZON,
        holidays: [],       // [{name, observe, _spItemId}]
        observed: [],       // observed holiday names
        history: [],        // [{year, holiday, person, _spItemId}]
        overrides: [],      // [{shiftStart, shiftEnd, slot, originalEngineer, newEngineer, reason, _spItemId, ...}]
        config: [],         // raw config kv rows
        rows: [], swaps: [], relaxedYears: [], warnYears: [], holidaysExpanded: [],
        usingDefaults: false
    };

    function getConfig(key, dflt) { const r = STATE.config.find(c => c.key === key); return r && r.value !== '' ? r.value : dflt; }

    async function loadAll(force = false) {
        const [eng, cfg, hol, hist, ovr] = await Promise.all([
            store.getAll('engineers', force), store.getAll('config', force), store.getAll('holidays', force),
            store.getAll('history', force), store.getAll('overrides', force)
        ]);
        STATE.config = cfg;
        STATE.usingDefaults = eng.length === 0;
        STATE.engineers = eng.length ? eng.slice() : DEFAULT_ROSTER.map((n, i) => ({ name: n, sortOrder: i + 1, active: 'Yes', _spItemId: null }));
        // Dedupe by name (defensive against a list that was seeded more than once).
        STATE.roster = [...new Set(STATE.engineers.filter(e => String(e.active).toLowerCase() !== 'no').sort((a, b) => (+a.sortOrder || 0) - (+b.sortOrder || 0)).map(e => e.name))];
        STATE.anchor = getConfig('AnchorDate', DEFAULT_ANCHOR).slice(0, 10);
        STATE.horizon = Number(getConfig('HorizonMonths', DEFAULT_HORIZON)) || DEFAULT_HORIZON;
        STATE.holidays = hol.length ? hol.slice() : DEFAULT_OBSERVED.map((n, i) => ({ name: n, observe: 'Yes', sortOrder: i + 1, _spItemId: null }));
        STATE.observed = [...new Set(STATE.holidays.filter(h => String(h.observe).toLowerCase() !== 'no').map(h => h.name))];
        STATE.history = hist.map(h => ({ year: Number(h.year), holiday: h.holiday, person: h.engineer, _spItemId: h._spItemId }));
        STATE.overrides = ovr.map(o => ({ ...o, _start: toUTC(o.shiftStart) }));
        computeSchedule();
    }

    function computeSchedule() {
        const engineers = STATE.roster;
        STATE.rows = []; STATE.swaps = []; STATE.relaxedYears = []; STATE.warnYears = []; STATE.holidaysExpanded = [];
        if (!engineers.length) return;
        const anchor = toUTC(STATE.anchor);
        let horizonEnd = addMonths(todayUTC(), STATE.horizon);
        if (horizonEnd < addMonths(anchor, 3)) horizonEnd = addMonths(anchor, 3); // always show at least a bit past anchor
        // Schedule starts at the anchor Monday — nothing is generated before it.
        let working = buildSchedule(engineers, anchor, anchor, horizonEnd);

        const startYear = anchor.getUTCFullYear(), endYear = horizonEnd.getUTCFullYear();
        const seen = new Set(), allHolidays = [];
        for (let y = startYear; y <= endYear; y++) {
            for (const name of STATE.observed) {
                const d = holidayDateForYear(name, y);
                if (!d || d < anchor || d > horizonEnd) continue;
                const k = y + '|' + name;
                if (seen.has(k)) continue; seen.add(k);      // dedupe (defensive — never place a holiday twice)
                allHolidays.push({ name, date: d });
            }
        }
        allHolidays.sort((a, b) => a.date - b.date);

        // Holiday fairness (KEPT): per year, no two-in-a-row stacking + no same holiday two years
        // running, tie-broken by the load/repeat penalty. Runs on the deduped holiday list.
        const swapsAll = [];
        for (let y = startYear; y <= endYear; y++) {
            const hols = allHolidays.filter(h => h.date.getUTCFullYear() === y);
            if (hols.length === 0) continue;
            const { solution: sol, relaxed } = solveYearFairness(working, hols, engineers, STATE.history, y);
            if (!sol) { STATE.warnYears.push(y); continue; }
            working = sol.rows;
            sol.swaps.forEach(s => swapsAll.push({ ...s, year: y }));
            if (relaxed) STATE.relaxedYears.push(y);
        }
        working.sort((a, b) => a.start - b.start);
        applyOverrides(working);
        STATE.rows = working; STATE.swaps = swapsAll; STATE.holidaysExpanded = allHolidays;
    }

    function applyOverrides(rows) {
        STATE.overrides.forEach(ov => {
            const key = String(ov.shiftStart).slice(0, 10);
            const row = rows.find(r => fmt(r.start) === key && (!ov.slot || r.label === ov.slot));
            if (row) { row._overrideFrom = row.person; row.person = ov.newEngineer; row._override = ov; }
        });
    }

    // holiday covering a row, if any (observed)
    function holidayOn(row) { return STATE.holidaysExpanded.find(h => h.date >= row.start && h.date < row.end) || null; }
    function rowsInRange(from, to) { return STATE.rows.filter(r => r.end > from && r.start < to); }

    /* ---------------------------------------------------------------------------
       Publish a rolling PER-DAY schedule cache to OnCall_Schedule. This is the ONLY
       thing the daily Teams flow reads (the flow can't run the fairness solver). The
       browser publishes on every save so intraday swaps propagate immediately; a nightly
       headless GitHub Action (see tools/publish-cache.mjs) is the autonomous backstop so
       the cache stays fresh even if nobody opens the app. Diff-based: only writes days
       that changed, prunes days before today.
       --------------------------------------------------------------------------- */
    async function publishSchedule(days = 120) {
        if (STATE.usingDefaults) return;                 // nothing seeded yet — nothing to publish
        const start = todayUTC(), end = addDays(start, days);
        const desired = {};
        for (let d = new Date(start); d <= end; d = addDays(d, 1)) {
            const noon = new Date(d.getTime() + 12 * 3600 * 1000);
            const o = ownerAt(STATE.rows, noon); if (!o) continue;
            const hol = STATE.holidaysExpanded.find(h => fmt(h.date) === fmt(d));
            desired[fmt(d)] = { key: fmt(d), date: fromDateInput(fmt(d)), engineer: o.person, slot: o.label, hours: o.hours, holiday: hol ? hol.name : '', isOverride: o._override ? 'Yes' : 'No' };
        }
        const existing = await store.getAll('schedule', true);
        const byKey = {}; existing.forEach(r => byKey[r.key] = r);
        for (const k of Object.keys(desired)) {
            const want = desired[k], have = byKey[k];
            if (!have) { await store.add('schedule', want); }
            else if (have.engineer !== want.engineer || have.slot !== want.slot || String(have.holiday || '') !== want.holiday || String(have.isOverride || '') !== want.isOverride) {
                await store.update('schedule', have._spItemId, want);
            }
        }
        for (const r of existing) { if (r.key && r.key < fmt(start)) await store.remove('schedule', r._spItemId); } // prune the past
    }
    // Fire-and-forget, throttled to once / 6h per browser so routine opens don't spam writes.
    function maybePublish(force) {
        try {
            const last = Number(localStorage.getItem('oncall_lastPublish') || 0);
            if (!force && Date.now() - last < 6 * 3600 * 1000) return;
            localStorage.setItem('oncall_lastPublish', String(Date.now()));
            publishSchedule().catch(e => console.warn('publishSchedule failed', e));
        } catch (e) { /* non-fatal */ }
    }

    /* ============================================================================
       ROUTING
       ============================================================================ */
    const ROUTES = [
        { key: 'dashboard', icon: '📊', label: 'Dashboard' },
        { key: 'schedule', icon: '🗓️', label: 'Schedule' },
        { key: 'calendar', icon: '📅', label: 'Calendar' },
        { key: 'me', icon: '👤', label: 'My shifts' },
        { key: 'reports', icon: '📈', label: 'Reports' },
        { key: 'overrides', icon: '🔁', label: 'Swaps / Overrides' },
        { key: 'config', icon: '⚙️', label: 'Config' },
        { key: 'guide', icon: '❓', label: 'Guide' }
    ];
    function parseRoute() {
        const h = (location.hash || '').replace(/^#\/?/, '');
        const parts = h.split('/').filter(Boolean);
        return { page: parts[0] || 'dashboard', id: parts[1] ? decodeURIComponent(parts[1]) : null };
    }
    function go(hash) { location.hash = hash; }
    window.addEventListener('hashchange', router);

    function renderNav() {
        const cur = parseRoute().page;
        document.getElementById('nav').innerHTML = ROUTES.map(r =>
            `<a class="${r.key === cur ? 'active' : ''}" href="#/${r.key}"><span>${r.icon}</span> ${r.label}</a>`).join('');
        document.getElementById('who').innerHTML =
            `${esc(currentUser?.name || currentUser?.username || '')}<br><a href="#" onclick="signOut();return false">Sign out</a>`;
    }
    function signOut() { msalInstance.logoutRedirect(); }

    async function start() {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('signin').style.display = 'none';
        document.getElementById('app').style.display = 'grid';
        try { await resolveSiteId(); } catch (e) { toast('Could not resolve the EngineeringPriorities SharePoint site — check access/permissions.', 'bad'); }
        try { await loadAll(); } catch (e) { console.error(e); toast('Failed to load on-call data: ' + e.message, 'bad'); }
        if (!location.hash) go('#/dashboard');
        router();
        maybePublish(); // keep the Teams-flow cache fresh (throttled, non-blocking)
    }

    async function router() {
        renderNav();
        const { page } = parseRoute();
        const el = document.getElementById('content');
        el.innerHTML = '<div class="empty">Loading…</div>';
        try {
            if (page === 'dashboard') return renderDashboard(el);
            if (page === 'schedule') return renderSchedulePage(el);
            if (page === 'calendar') return renderCalendarPage(el);
            if (page === 'me') return renderMyShiftsPage(el);
            if (page === 'reports') return renderReportsPage(el);
            if (page === 'guide') return renderGuidePage(el);
            if (page === 'overrides') return renderOverridesPage(el);
            if (page === 'config') return renderConfigPage(el);
            el.innerHTML = '<div class="empty">Not found.</div>';
        } catch (e) { console.error(e); el.innerHTML = `<div class="status bad">Error: ${esc(e.message)}</div>`; }
    }

    function defaultsBanner() {
        return STATE.usingDefaults
            ? `<div class="status warn">Showing built-in defaults (roster ${esc(STATE.roster.join(', '))}). Nothing is saved to SharePoint yet — open <a href="#/config">Config</a> and click “Seed defaults to SharePoint”.</div>`
            : '';
    }
    function healthBanner() {
        let h = '';
        if (STATE.warnYears.length) h += `<div class="status bad">No clean fairness solution for ${STATE.warnYears.join(', ')} — review the holiday list or roster size for those years.</div>`;
        if (STATE.relaxedYears.length) h += `<div class="status warn">Relaxed the “no same holiday two years running” rule in ${STATE.relaxedYears.join(', ')} (team size vs. holiday count made it unavoidable).</div>`;
        return h;
    }

    /* ============================================================================
       DASHBOARD
       ============================================================================ */
    function renderDashboard(el) {

            <div class="tile"><div class="k">Holidays observed</div><div class="v">${STATE.observed.length}</div><div class="sub">auto-balanced each year</div></div>

            <div class="tile"><div class="k">Horizon</div><div class="v">${STATE.horizon}mo</div><div class="sub">anchor ${esc(STATE.anchor)}</div></div>

            <div class="weekstrip">${week.map(r => {
                const c = colorFor(r.person); const isNow = now >= r.start && now < r.end; const h = holidayOn(r);
                return `<div class="ws-card ${isNow ? 'today' : ''}">
                    <div class="slot">${r.label}${r.label === 'Weekend' ? '' : ''}</div>
                    <div class="nm" style="color:${c}">${esc(r.person)}</div>

                </div>`;

        </div></div>`;

    function mondayOf(date) { const d = new Date(Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), date.getUTCDate())); const diff = (d.getUTCDay() + 6) % 7; return addDays(d, -diff); }
    async function refreshAll() { store.clear(); try { await loadAll(true); toast('Refreshed from SharePoint', 'ok'); } catch (e) { toast(e.message, 'bad'); } router(); }

    /* ============================================================================
       SCHEDULE
       ============================================================================ */
    let schedFrom = null, schedTo = null;
    function renderSchedulePage(el) {
        if (!schedFrom) { schedFrom = fmt(mondayOf(todayUTC())); schedTo = fmt(addDays(mondayOf(todayUTC()), 56)); }
        const from = toUTC(schedFrom), to = addDays(toUTC(schedTo), 1);
        const rows = rowsInRange(from, to).sort((a, b) => a.start - b.start);
        const adjacency = checkAdjacency(STATE.rows.filter(r => !r._override)); // manual overrides are intentional
        el.innerHTML = `
        <div class="page-head"><h1>Schedule</h1>
            <div class="actions">
                <button class="btn" onclick="exportCSV()">⬇ CSV</button>
                <button class="btn" onclick="exportICS()">⬇ .ics (Outlook)</button>
            </div></div>
        ${defaultsBanner()}${healthBanner()}
        ${adjacency.length === 0
            ? '<div class="status ok">Clean — no one goes straight from one shift into another with zero rest.</div>'
            : `<div class="status bad">${adjacency.length} back-to-back stacking point(s) detected. Check Config roster order.</div>`}
        <div class="toolbar">
            <div><label>From</label><input type="date" value="${schedFrom}" onchange="schedFrom=this.value;router()"></div>
            <div><label>To</label><input type="date" value="${schedTo}" onchange="schedTo=this.value;router()"></div>
        </div>
        <div class="panel"><div class="table-wrap"><table>
            <thead><tr><th>Start</th><th>End</th><th>Slot</th><th>Engineer</th><th>Hrs</th><th>Notes</th></tr></thead>
            <tbody>${rows.map(r => {
                const h = holidayOn(r);
                const cls = r._override ? 'ov' : (h ? 'hl' : '');
                const note = [h ? `🎉 ${esc(h.name)}` : '', r._override ? `🔁 override (was ${esc(r._overrideFrom)})${r._override.reason ? ' · ' + esc(r._override.reason) : ''}` : '',
                    STATE.swaps.some(s => fmt(s.holiday.date) === fmt(r.start)) ? 'holiday swap' : '',
                    STATE.swaps.some(s => fmt(s.partner.start) === fmt(r.start)) ? 'traded shift' : ''].filter(Boolean).join(' · ');
                return `<tr class="${cls}"><td class="nowrap">${fmtNiceY(r.start)}</td><td class="nowrap">${fmtNiceY(r.end)}</td><td>${r.label}</td><td>${personPill(r.person)}</td><td>${r.hours}</td><td>${note}</td></tr>`;
            }).join('') || '<tr><td colspan="6" class="empty">No shifts in this range.</td></tr>'}</tbody>
        </table></div></div>`;
    }

    function exportCSV() {
        const from = toUTC(schedFrom), to = addDays(toUTC(schedTo), 1);
        const rows = rowsInRange(from, to).sort((a, b) => a.start - b.start);
        let csv = 'Start,End,Slot,Engineer,Hours,Holiday,Note\n';
        rows.forEach(r => {
            const h = holidayOn(r);
            const note = r._override ? `override (was ${r._overrideFrom})` : '';
            csv += `${fmt(r.start)} 08:00,${fmt(r.end)} 08:00,${r.label},${r.person},${r.hours},${h ? h.name : ''},${note}\n`;
        });
        downloadBlob(csv, 'text/csv', 'oncall_schedule.csv');
    }
    function icsFmt(d) { return fmt(d).replace(/-/g, '') + 'T080000'; }
    function exportICS() {
        const from = toUTC(schedFrom), to = addDays(toUTC(schedTo), 1);
        const rows = rowsInRange(from, to).sort((a, b) => a.start - b.start);
        const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Iris On-Call//EN', 'CALSCALE:GREGORIAN'];
        rows.forEach((r, i) => {
            const h = holidayOn(r);
            lines.push('BEGIN:VEVENT');
            lines.push(`UID:oncall-${fmt(r.start)}-${r.label}@iris-oncall`);
            lines.push(`DTSTAMP:${icsFmt(todayUTC())}Z`);
            lines.push(`DTSTART:${icsFmt(r.start)}`);
            lines.push(`DTEND:${icsFmt(r.end)}`);
            lines.push(`SUMMARY:On-Call: ${r.person}${h ? ' (' + h.name + ')' : ''}`);
            lines.push(`DESCRIPTION:${r.label} on-call shift (${r.hours}h).${r._override ? ' Manual override, was ' + r._overrideFrom + '.' : ''}`);
            lines.push('END:VEVENT');
        });
        lines.push('END:VCALENDAR');
        downloadBlob(lines.join('\r\n'), 'text/calendar', 'oncall_schedule.ics');
    }
    function downloadBlob(content, type, name) {
        const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([content], { type })); a.download = name; a.click();
    }

    /* ============================================================================
       CALENDAR (month grid)
       ============================================================================ */
    let calYear = null, calMonth = null;
    function renderCalendarPage(el) {
        const t = todayUTC();
        if (calYear == null) { calYear = t.getUTCFullYear(); calMonth = t.getUTCMonth(); }
        const first = new Date(Date.UTC(calYear, calMonth, 1));
        const gridStart = mondayOf(first);
        const monthName = first.toLocaleDateString('en-US', { month: 'long', year: 'numeric', timeZone: 'UTC' });
        const dows = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
        let cells = '';
        for (let i = 0; i < 42; i++) {
            const d = addDays(gridStart, i);
            const noon = new Date(d.getTime() + 12 * 3600 * 1000);
            const owner = ownerAt(STATE.rows, noon);
            const inMonth = d.getUTCMonth() === calMonth;
            const isToday = fmt(d) === fmt(t);
            const hol = STATE.holidaysExpanded.find(h => fmt(h.date) === fmt(d));
            const c = owner ? colorFor(owner.person) : 'var(--faint)';
            cells += `<div class="day ${inMonth ? '' : 'out'} ${isToday ? 'today' : ''}">
                <div class="dnum">${d.getUTCDate()}</div>
                ${owner ? `<div class="who" style="color:${c}">${esc(owner.person)}</div>` : ''}
                ${hol ? `<div class="hol">🎉 ${esc(hol.name)}</div>` : ''}
            </div>`;
        }
        el.innerHTML = `
        <div class="page-head"><h1>Calendar</h1>
            <div class="actions">
                <button class="btn" onclick="calStep(-1)">← Prev</button>
                <button class="btn" onclick="calToday()">Today</button>
                <button class="btn" onclick="calStep(1)">Next →</button>
            </div></div>
        ${defaultsBanner()}
        <div class="panel"><h2>${monthName}</h2><div class="body">
            <div class="cal">${dows.map(d => `<div class="dow">${d}</div>`).join('')}${cells}</div>
            <div class="pill-row" style="margin-top:12px">${STATE.roster.map(n => personPill(n)).join(' ')}</div>
        </div></div>`;
    }
    function calStep(n) { calMonth += n; if (calMonth < 0) { calMonth = 11; calYear--; } if (calMonth > 11) { calMonth = 0; calYear++; } router(); }
    function calToday() { const t = todayUTC(); calYear = t.getUTCFullYear(); calMonth = t.getUTCMonth(); router(); }

    /* ============================================================================
       MY SHIFTS — per-person view (defaults to the signed-in user if their name
       matches a roster member): next up, upcoming shifts, next weekend/holiday, load.
       ============================================================================ */
    let myEngineer = null;
    function guessMe() {
        if (myEngineer && STATE.roster.includes(myEngineer)) return myEngineer;

        return STATE.roster.find(r => nm.includes(r.toLowerCase())) || STATE.roster[0] || null;

        <div class="tiles">

            <thead><tr><th>Start</th><th>End</th><th>Slot</th><th>Hrs</th><th>Notes</th></tr></thead>
            <tbody>${upcoming.slice(0, 20).map(r => {
                const h = holidayOn(r);
                return `<tr class="${r._override ? 'ov' : (h ? 'hl' : '')}"><td class="nowrap">${fmtNiceY(r.start)}</td><td class="nowrap">${fmtNiceY(r.end)}</td><td>${r.label}</td><td>${r.hours}</td><td>${[h ? '🎉 ' + esc(h.name) : '', r._override ? '🔁 override' : ''].filter(Boolean).join(' · ')}</td></tr>`;

        </table></div></div>`;
    }
