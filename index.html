            next shift, your next weekend and next holiday, and a list of everything coming up.</p>
        </div></div>
        <div class="panel"><h2>I need someone to cover (vacation, sick, favor)</h2><div class="body">
            <p>Go to <b>Swaps / Overrides → New override</b>. Pick the shift (date + slot), choose who's covering — a
            teammate or anyone in the directory — and add a reason. It layers on top of the rotation and is fully
            reversible: remove it and the shift reverts. Every override is logged on the <b>Reports</b> page.</p>
        </div></div>
        <div class="panel"><h2>Get it on my phone / calendar</h2><div class="body">
            <p>On <b>Schedule</b>, use <b>⬇ .ics</b> to import into Outlook/your phone calendar, or <b>⬇ CSV</b> for a
            spreadsheet. A <b>daily Teams post</b> also announces who has the pager each morning.</p>
        </div></div>
        <div class="panel"><h2>How the rotation works</h2><div class="body">
            <p>Each week has 6 shifts — Monday–Friday (24h each) and one Weekend (Sat 8am → Mon 8am), handing off at
            <b>8:00 AM</b>. The pager passes through the team in a fixed order, continuously. Major <b>holidays are
            auto-balanced</b> each year: nobody covers two holidays in a row, and nobody gets the same holiday two
            years running — the app trades equal-length shifts so total hours stay even.</p>
        </div></div>
        <div class="panel"><h2>Admins — <a href="#/config">Config</a></h2><div class="body">
            <p>Config holds the roster + order, the start (anchor) date, how far ahead to show, and which holidays are
            observed. It also publishes the schedule cache the daily Teams post reads.</p>
        </div></div>`;
    }

    /* ============================================================================
       OVERRIDES (manual swaps) — CRUD against OnCall_Overrides
       ============================================================================ */
    function renderOverridesPage(el) {
        const ovr = STATE.overrides.slice().sort((a, b) => (a._start || 0) - (b._start || 0));
        el.innerHTML = `
        <div class="page-head"><h1>Swaps / Overrides</h1>
            <div class="actions"><button class="btn primary" onclick="openOverrideModal()">+ New override</button></div></div>
        ${defaultsBanner()}
        <p class="muted">Manual, one-off reassignments (vacation, sick, favor-swaps) that layer on top of the automatic rotation. They never change the underlying algorithm — remove one and the shift reverts.</p>
        <div class="panel"><div class="table-wrap"><table>
            <thead><tr><th>Shift start</th><th>Slot</th><th>Originally</th><th>Now covered by</th><th>Reason</th><th>By</th><th></th></tr></thead>
            <tbody>${ovr.map(o => `<tr>
                <td class="nowrap">${o._start ? fmtNiceY(o._start) : esc(o.shiftStart)}</td>
                <td>${esc(o.slot)}</td><td>${esc(o.originalEngineer)}</td><td>${personPill(o.newEngineer)}</td>
                <td>${esc(o.reason)}</td><td class="muted">${esc(o.createdBy)}</td>
                <td class="right"><button class="btn sm danger" onclick="deleteOverride('${o._spItemId}')">Remove</button></td>
            </tr>`).join('') || '<tr><td colspan="7" class="empty">No overrides. The schedule follows the pure rotation + holiday fairness.</td></tr>'}</tbody>
        </table></div></div>`;
    }

    let ovShiftList = [];
    function openOverrideModal() {
        if (STATE.usingDefaults) { toast('Seed the roster to SharePoint first (Config).', 'warn'); return; }
        const now = nowUTC();
        ovShiftList = STATE.rows.filter(r => r.end > now).sort((a, b) => a.start - b.start).slice(0, 200);
        if (!ovShiftList.length) { toast('No upcoming shifts to reassign.', 'warn'); return; }
        openModal(`
        <div class="m-head"><h3>New swap / override</h3><button class="x" onclick="closeModal()">×</button></div>
        <div class="m-body">
            <div class="field"><label>Which shift needs covering?</label>
                <select id="ov_shift" onchange="ovRefreshOwner()">${ovShiftList.map((r, i) => {
                    const h = holidayOn(r);
                    return `<option value="${i}">${fmtNiceY(r.start)} · ${r.label}${r.label === 'Weekend' ? ' (Sat→Mon)' : ''} — ${esc(r.person)}${h ? ' · ' + esc(h.name) : ''}</option>`;
                }).join('')}</select></div>
            <div class="field"><label>Currently assigned to</label><input type="text" id="ov_owner" readonly value="${esc(ovShiftList[0].person)}"></div>
            <div class="field"><label>Reassign to (roster)</label>
                <select id="ov_new"><option value="">— pick from roster —</option>${STATE.roster.map(n => `<option>${esc(n)}</option>`).join('')}</select></div>
            <div class="field"><label>…or search the directory (anyone can cover)</label>
                <input type="text" id="ov_dir" placeholder="Type a name…"><div class="people-results" id="ov_dirRes"></div></div>
            <div class="field"><label>Reason (optional)</label><input type="text" id="ov_reason" placeholder="e.g. Ian on PTO — Kris covering"></div>
        </div>
        <div class="m-foot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveOverride()">Save</button></div>`);
        setTimeout(() => wirePicker(document.getElementById('ov_dir'), document.getElementById('ov_dirRes'), n => { document.getElementById('ov_new').value = ''; document.getElementById('ov_dir').value = n; }), 30);
    }
    function ovSelectedRow() { const el = document.getElementById('ov_shift'); return el ? (ovShiftList[+el.value] || null) : null; }
    function ovRefreshOwner() { const o = ovSelectedRow(); const f = document.getElementById('ov_owner'); if (f) f.value = o ? o.person : '—'; }
    async function saveOverride() {
        const row = ovSelectedRow();
        const newEng = document.getElementById('ov_dir').value.trim() || document.getElementById('ov_new').value;
        const reason = document.getElementById('ov_reason').value.trim();
        if (!row) { toast('Pick a shift to reassign.', 'bad'); return; }
        if (!newEng) { toast('Pick who will cover it.', 'bad'); return; }
        const dateStr = fmt(row.start);
        const rec = {
            key: `${dateStr} | ${row.label}`, shiftStart: fromDateInput(dateStr), shiftEnd: fromDateInput(fmt(row.end)),
            slot: row.label, originalEngineer: row._overrideFrom || row.person, newEngineer: newEng, reason,
            createdBy: currentUser?.name || currentUser?.username || '', createdDate: new Date().toISOString()
        };
        try {
            const existing = STATE.overrides.find(o => fmt(o._start) === dateStr && o.slot === row.label);
            if (existing && existing._spItemId) await store.update('overrides', existing._spItemId, rec);
            else await store.add('overrides', rec);
            toast('Override saved', 'ok'); closeModal(); await loadAll(true); router(); maybePublish(true);
        } catch (e) { toast('Save failed: ' + e.message, 'bad'); }
    }
    async function deleteOverride(id) {
        if (!id || id === 'null') { toast('This override is not saved.', 'warn'); return; }
        if (!confirm('Remove this override? The shift reverts to the rotation.')) return;
        try { await store.remove('overrides', id); toast('Removed', 'ok'); await loadAll(true); router(); maybePublish(true); }
        catch (e) { toast('Delete failed: ' + e.message, 'bad'); }
    }
    function fromDateInput(v) { return v ? new Date(v + 'T12:00:00Z').toISOString() : ''; }

    /* ============================================================================
       CONFIG — roster, anchor, horizon, holidays, seed, save-history
       ============================================================================ */
    function renderConfigPage(el) {
        el.innerHTML = `
        <div class="page-head"><h1>Config</h1></div>
        ${STATE.usingDefaults ? '<div class="status warn">Nothing is saved to SharePoint yet — click “Seed defaults to SharePoint” to create the starting roster, anchor and holidays.</div>' : ''}
        <div class="panel"><h2>Roster (rotation order)</h2><div class="body">
            <p class="muted">Order is the rotation order. Position 1 takes the anchor Monday, then it cycles. Deactivate instead of deleting to preserve history.</p>
            <div class="table-wrap"><table><thead><tr><th>#</th><th>Engineer</th><th>Active</th><th>Order</th><th></th></tr></thead>
            <tbody id="rosterBody">${rosterRowsHtml()}</tbody></table></div>
            <div class="toolbar" style="margin-top:10px">
                <div style="position:relative"><input type="text" id="cfg_addName" placeholder="Add engineer (type or search directory)…" style="min-width:280px">
                    <div class="people-results" id="cfg_addRes"></div></div>
                <button class="btn" onclick="addEngineer()">+ Add</button>
                <button class="btn primary" onclick="saveRoster()">Save roster</button>
            </div>
        </div></div>
        <div class="panel"><h2>Rotation settings</h2><div class="body">
            <div class="grid2">
                <div class="field"><label>Anchor start (original Monday — never change once live)</label><input type="date" id="cfg_anchor" value="${esc(STATE.anchor)}"></div>
                <div class="field"><label>Horizon (months ahead to keep populated)</label><input type="number" id="cfg_horizon" min="3" max="60" value="${STATE.horizon}"></div>
            </div>
            <div id="cfg_anchorNote" class="muted"></div>
            <button class="btn primary" onclick="saveSettings()">Save settings</button>
        </div></div>
        <div class="panel"><h2>Observed holidays</h2><div class="body">
            <p class="muted">Dates are computed automatically each year (no hardcoding). Final list still to be confirmed with HR — toggle freely; the fairness engine rebalances instantly.</p>
            <div class="grid3">${RECOGNIZED_HOLIDAYS.map(n => {
                const on = STATE.observed.includes(n);
                return `<label style="display:flex;gap:8px;align-items:center;font-weight:500;color:var(--ink)"><input type="checkbox" style="width:auto" data-hol="${esc(n)}" ${on ? 'checked' : ''}> ${esc(n)}</label>`;
            }).join('')}</div>
            <button class="btn primary" style="margin-top:12px" onclick="saveHolidays()">Save holidays</button>
        </div></div>
        <div class="panel"><h2>History &amp; maintenance</h2><div class="body">
            <p class="muted">The fairness engine keeps holidays balanced across years using a saved History log. Save each year's assignments once they're settled so future years account for them. ${STATE.history.length} history row(s) currently saved.</p>
            <div class="toolbar">
                <button class="btn" onclick="saveHistory()">Save computed holiday assignments to History</button>
                ${STATE.usingDefaults ? '<button class="btn primary" onclick="seedDefaults()">Seed defaults to SharePoint</button>' : ''}
                <button class="btn" onclick="refreshAll()">↻ Reload from SharePoint</button>
            </div>
            <p class="muted" style="margin-top:14px">The daily Teams post reads a per-day cache (<code>OnCall_Schedule</code>). It republishes automatically on every save and each app open; publish it by hand here if you just changed something and want Teams updated now.</p>
            <button class="btn" onclick="publishNow()">Publish schedule cache now</button>
        </div></div>`;
        setTimeout(() => {
            wirePicker(document.getElementById('cfg_addName'), document.getElementById('cfg_addRes'), n => { document.getElementById('cfg_addName').value = n; document.getElementById('cfg_addRes').innerHTML = ''; });
            const an = document.getElementById('cfg_anchor'); an.addEventListener('change', cfgAnchorNote); cfgAnchorNote();
        }, 30);
    }
    // editable working copy of the roster for the Config page
    let rosterDraft = null;
    function rosterRowsHtml() {
        rosterDraft = STATE.engineers.map(e => ({ ...e }));
        return rosterDraft.sort((a, b) => (+a.sortOrder || 0) - (+b.sortOrder || 0)).map((e, i) => `
            <tr data-i="${i}">
                <td>${i + 1}</td><td>${esc(e.name)}</td>
                <td><select onchange="rosterSet(${i},'active',this.value)"><option ${String(e.active).toLowerCase() !== 'no' ? 'selected' : ''}>Yes</option><option ${String(e.active).toLowerCase() === 'no' ? 'selected' : ''}>No</option></select></td>
                <td class="nowrap"><button class="btn sm" onclick="rosterMove(${i},-1)">↑</button> <button class="btn sm" onclick="rosterMove(${i},1)">↓</button></td>
                <td class="right"><button class="btn sm danger" onclick="rosterRemove(${i})">Remove</button></td>
            </tr>`).join('');
    }
    function rosterSet(i, k, v) { rosterDraft[i][k] = v; }
    function rosterMove(i, dir) {
        const j = i + dir; if (j < 0 || j >= rosterDraft.length) return;
        [rosterDraft[i], rosterDraft[j]] = [rosterDraft[j], rosterDraft[i]];
        rosterDraft.forEach((e, k) => e.sortOrder = k + 1);
        redrawRoster();
    }
    function rosterRemove(i) { rosterDraft.splice(i, 1); rosterDraft.forEach((e, k) => e.sortOrder = k + 1); redrawRoster(); }
    function addEngineer() {
        const name = document.getElementById('cfg_addName').value.trim(); if (!name) return;
        rosterDraft.push({ name, active: 'Yes', sortOrder: rosterDraft.length + 1, _spItemId: null });
        document.getElementById('cfg_addName').value = ''; redrawRoster();
    }
    function redrawRoster() {
        const body = document.getElementById('rosterBody');
        body.innerHTML = rosterDraft.map((e, i) => `
            <tr data-i="${i}">
                <td>${i + 1}</td><td>${esc(e.name)}</td>
                <td><select onchange="rosterSet(${i},'active',this.value)"><option ${String(e.active).toLowerCase() !== 'no' ? 'selected' : ''}>Yes</option><option ${String(e.active).toLowerCase() === 'no' ? 'selected' : ''}>No</option></select></td>
                <td class="nowrap"><button class="btn sm" onclick="rosterMove(${i},-1)">↑</button> <button class="btn sm" onclick="rosterMove(${i},1)">↓</button></td>
                <td class="right"><button class="btn sm danger" onclick="rosterRemove(${i})">Remove</button></td>
            </tr>`).join('');
    }
    async function saveRoster() {
        try {
            // adds/updates
            for (const e of rosterDraft) {
                const rec = { name: e.name, sortOrder: e.sortOrder, active: e.active || 'Yes' };
                if (e._spItemId) await store.update('engineers', e._spItemId, rec);
                else await store.add('engineers', rec);
            }
            // removals: anything in STATE that's no longer in the draft
            for (const old of STATE.engineers) {
                if (old._spItemId && !rosterDraft.some(e => e._spItemId === old._spItemId)) await store.remove('engineers', old._spItemId);
            }
            toast('Roster saved', 'ok'); await loadAll(true); router(); maybePublish(true);
        } catch (e) { toast('Save failed: ' + e.message, 'bad'); }
    }
    function cfgAnchorNote() {
        const v = document.getElementById('cfg_anchor').value; const note = document.getElementById('cfg_anchorNote');
        if (!v) return; const d = toUTC(v);
        note.textContent = d.getUTCDay() === 1 ? 'Starts Monday 8:00 AM — good.' : '⚠ Not a Monday — the rotation assumes a Monday 8:00 AM start.';
        note.style.color = d.getUTCDay() === 1 ? 'var(--muted)' : 'var(--warn)';
    }
    async function saveSettings() {
        try {
            await upsertConfig('AnchorDate', document.getElementById('cfg_anchor').value);
            await upsertConfig('HorizonMonths', String(document.getElementById('cfg_horizon').value));
            toast('Settings saved', 'ok'); await loadAll(true); router(); maybePublish(true);
        } catch (e) { toast('Save failed: ' + e.message, 'bad'); }
    }
    async function upsertConfig(key, value) {
        const existing = STATE.config.find(c => c.key === key);
        if (existing && existing._spItemId) await store.update('config', existing._spItemId, { key, value });
        else await store.add('config', { key, value });
    }
    async function saveHolidays() {
        try {
            const checked = [...document.querySelectorAll('[data-hol]')].filter(c => c.checked).map(c => c.dataset.hol);
            // upsert each recognized holiday with observe Yes/No
            for (let i = 0; i < RECOGNIZED_HOLIDAYS.length; i++) {
                const name = RECOGNIZED_HOLIDAYS[i];
                const observe = checked.includes(name) ? 'Yes' : 'No';
                const existing = STATE.holidays.find(h => h.name === name);
                const rec = { name, observe, sortOrder: i + 1 };
                if (existing && existing._spItemId) await store.update('holidays', existing._spItemId, rec);
                else await store.add('holidays', rec);
            }
            toast('Holidays saved', 'ok'); await loadAll(true); router(); maybePublish(true);
        } catch (e) { toast('Save failed: ' + e.message, 'bad'); }
    }
    async function saveHistory() {
        try {
            let added = 0;
            for (const h of STATE.holidaysExpanded) {
                const y = h.date.getUTCFullYear();
                if (STATE.history.some(hh => hh.year === y && hh.holiday === h.name)) continue;
                const o = ownerAt(STATE.rows, h.date); if (!o) continue;
                await store.add('history', { key: `${y} | ${h.name}`, year: y, holiday: h.name, engineer: o.person });
                added++;
            }
            toast(added ? `${added} history row(s) saved` : 'History already up to date', 'ok'); await loadAll(true); router(); maybePublish(true);
        } catch (e) { toast('Save failed: ' + e.message, 'bad'); }
    }
    async function seedDefaults() {
        if (!confirm('Create starting roster, anchor, horizon and holidays in SharePoint?')) return;
        try {
            // Idempotent: only add what isn't already there, so re-running never creates duplicates.
            const [eng, cfg, hol] = await Promise.all([store.getAll('engineers', true), store.getAll('config', true), store.getAll('holidays', true)]);
            const haveEng = new Set(eng.map(e => e.name)), haveCfg = new Set(cfg.map(c => c.key)), haveHol = new Set(hol.map(h => h.name));
            for (let i = 0; i < DEFAULT_ROSTER.length; i++) if (!haveEng.has(DEFAULT_ROSTER[i])) await store.add('engineers', { name: DEFAULT_ROSTER[i], sortOrder: i + 1, active: 'Yes' });
            if (!haveCfg.has('AnchorDate')) await store.add('config', { key: 'AnchorDate', value: DEFAULT_ANCHOR });
            if (!haveCfg.has('HorizonMonths')) await store.add('config', { key: 'HorizonMonths', value: String(DEFAULT_HORIZON) });
            for (let i = 0; i < RECOGNIZED_HOLIDAYS.length; i++) {
                const name = RECOGNIZED_HOLIDAYS[i];
                if (!haveHol.has(name)) await store.add('holidays', { name, observe: DEFAULT_OBSERVED.includes(name) ? 'Yes' : 'No', sortOrder: i + 1 });
            }
            toast('Seeded to SharePoint', 'ok'); await loadAll(true); router(); maybePublish(true);
        } catch (e) { toast('Seed failed: ' + e.message, 'bad'); }
    }

    async function publishNow() {
        if (STATE.usingDefaults) { toast('Seed the roster to SharePoint first.', 'warn'); return; }
        try { toast('Publishing…'); await publishSchedule(); localStorage.setItem('oncall_lastPublish', String(Date.now())); toast('Schedule cache published for the Teams flow', 'ok'); }
        catch (e) { toast('Publish failed: ' + e.message, 'bad'); }
    }

    /* -------------------------------------------------------------------- modal */
    function openModal(html, wide) {
        const m = document.getElementById('modal'); m.className = 'modal' + (wide ? ' wide' : ''); m.innerHTML = html;
        document.getElementById('modalBg').classList.add('open');
    }
    function closeModal() { document.getElementById('modalBg').classList.remove('open'); document.getElementById('modal').innerHTML = ''; }
    </script>
</body>
</html>
